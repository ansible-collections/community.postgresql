breaking_changes:
  - postgresql_membership - on PostgreSQL 16 and later a ``memberships`` row names the granting role explicitly, and manages the grant recorded under it. A row where the connecting role holds ``ADMIN OPTION`` only indirectly needs ``granted_by`` set to the role that holds it. The deprecated ``groups`` option is not affected, since it names no granting role and leaves the choice to PostgreSQL as before.
  - postgresql_membership - with ``memberships``, ``state=absent`` and ``state=exact`` no longer report a change for a membership they cannot revoke, meaning one recorded under a different granting role. A handler triggered by that result no longer fires.
  - postgresql_membership - ``state=exact`` now reports ``granted`` with an entry for every requested group, as ``state=present`` already did. It previously listed only the groups that changed, so a task asserting ``result.granted == {}`` on an unchanged run now sees one empty entry per requested group.
  - postgresql_membership - with ``memberships``, ``state=present`` now creates its own grant on PostgreSQL 16 and later when only another role had granted the membership, for example through the ``WITH ADMIN OPTION`` grant PostgreSQL creates when a non-superuser creates a role. An existing installation that was reported unchanged is reported changed on the next run, which fires the handlers notified by it. The deprecated ``groups`` option keeps treating the membership as present, whoever granted it (https://github.com/ansible-collections/community.postgresql/issues/757).

minor_changes:
  - postgresql_membership - add the ``admin_option``, ``inherit_option`` and ``set_option`` keys to ``memberships``, controlling the membership options of the grants the module makes on PostgreSQL 16 and later (https://github.com/ansible-collections/community.postgresql/issues/757).
  - postgresql_membership - add the ``granted_by`` key to ``memberships``, naming the role to record as the granting role. It is required when the connecting role holds ``ADMIN OPTION`` only indirectly, and manages a grant made by a different role.
  - postgresql_membership - move ``PgMembership`` out of the shared ``postgres`` module_utils into a ``membership`` module_utils of its own, split it into ``PgMembershipByPair`` for the deprecated ``groups`` option and ``PgMembershipByGrantor`` for ``memberships``, one object per task rather than one per membership, and derive the name of every membership option from one constant instead of restating it per call site. An external importer of ``PgMembership`` has to follow the move and pick the class of its model.
  - postgresql_membership - add the ``grants`` and ``effective_options`` return values, reporting every grant of the requested pairs and the options the target role effectively holds.
  - postgresql_membership - add the ``memberships`` option, naming one membership per row so that the granting role and the membership options can differ between them, which the top-level parameters cannot express because they name one value for the whole task. The whole task stays one transaction, unlike a loop over the module. It is mutually exclusive with ``groups``, which describes a single membership too; ``target_roles`` may still be given at the top level as the default for the rows that do not name their own.
  - postgresql_membership - with ``memberships``, check that the granting role holds ``ADMIN OPTION`` on every group about to be granted before emitting anything, and fail naming the roles that do hold it, separating a group whose ``ADMIN OPTION`` is held by a role that can be named instead, one where it is held only out of reach, and one where no role holds it at all. Left to the server, the refusal names neither the option that is missing nor a role that holds it, and arrives only once a statement is attempted. Only the groups a ``GRANT`` is actually emitted for are checked, so a task with nothing left to do keeps succeeding. PostgreSQL waives the requirement for the bootstrap superuser only, so being connected as some other superuser does not skip the check.
  - postgresql_membership - before recording a grant as the ``granted_by`` role, or revoking a grant recorded under it, check that the connecting role has that role's privileges, and fail naming the role instead of passing on the server's error. The deprecated ``groups`` option gets the same check for every granting role it finds recorded, before it revokes. A task with nothing left to do is not checked, so it keeps succeeding.
  - postgresql_membership - read the memberships of every target role, and the existence of every role named, once per task rather than once per ``memberships`` row. A task of three rows against two target roles issues four queries instead of nineteen.

deprecated_features:
  - postgresql_membership - the ``groups`` option is deprecated and will be removed in version 6.0.0. Use the ``groups`` key of ``memberships`` instead, which describes one membership rather than one value for the whole task. The key itself is not deprecated, and ``target_roles`` stays at the top level. An empty ``memberships`` list means what an empty ``groups`` list meant, namely that the target roles are to be a member of no group at all. The membership options and the granting role are only ever given inside ``memberships``. On PostgreSQL 16 and later the two differ in what they take a membership to be. ``groups`` names no granting role, so it treats the (group, target role) pair as the membership, whoever granted it, while a ``memberships`` row manages the one grant recorded under its granting role.

bugfixes:
  - postgresql_membership - fix ``state=absent`` and the revoking half of ``state=exact`` not removing a membership on PostgreSQL 16 and later when another role had granted it. The ``REVOKE`` named no granting role, so the server applied it to the grant of whichever role it picks itself, the membership survived, and the module reported a change on every run without ever converging. The deprecated ``groups`` option now revokes every grant of the pair, one ``REVOKE`` naming each granting role, and a ``memberships`` row revokes the grant recorded under its own. When the connecting role lacks the privileges of one of those granting roles, the deprecated option now fails naming it before anything is emitted, where it used to succeed without revoking anything.
  - postgresql_membership - fix a group named more than once being granted or revoked twice, which emitted the statement twice and listed the target role twice in ``granted`` or ``revoked``.
  - postgresql_membership - fix an empty ``target_roles`` list failing with a SQL syntax error; it is now a no-op, as an empty ``groups`` list already was.
  - postgresql_membership - fix a group or role whose name contains a single or double quote producing invalid SQL. Names are now passed as query parameters or quoted as identifiers instead of being interpolated raw.
