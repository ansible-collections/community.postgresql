breaking_changes:
  - postgresql_membership - on PostgreSQL 16 and later the module names the granting role explicitly. A task where the connecting role holds ``ADMIN OPTION`` only indirectly now needs ``granted_by`` set to the role that holds it. ``granted_by`` names one role for the whole task, so groups whose ``ADMIN OPTION`` is held by different roles have to be split into a task each.
  - postgresql_membership - ``state=absent`` and ``state=exact`` no longer report a change for a membership they cannot revoke, meaning one recorded under a different granting role. A handler triggered by that result no longer fires.
  - postgresql_membership - ``state=exact`` now reports ``granted`` with an entry for every requested group, as ``state=present`` already did. It previously listed only the groups that changed, so a task asserting ``result.granted == {}`` on an unchanged run now sees one empty entry per requested group.
  - postgresql_membership - ``state=present`` now creates its own grant on PostgreSQL 16 and later when only another role had granted the membership, for example through the ``WITH ADMIN OPTION`` grant PostgreSQL creates when a non-superuser creates a role. An existing installation that was reported unchanged is reported changed on the next run, which fires the handlers notified by it (https://github.com/ansible-collections/community.postgresql/issues/757).

minor_changes:
  - postgresql_membership - add the ``admin_option``, ``inherit_option`` and ``set_option`` options, controlling the membership options of the grants the module makes on PostgreSQL 16 and later (https://github.com/ansible-collections/community.postgresql/issues/757).
  - postgresql_membership - add the ``granted_by`` option, naming the role to record as the granting role. It is required when the connecting role holds ``ADMIN OPTION`` only indirectly, and manages a grant made by a different role.
  - postgresql_membership - move ``PgMembership`` out of the shared ``postgres`` module_utils into a ``membership`` module_utils of its own, and derive the name of every membership option from one constant instead of restating it per call site. No behaviour change; an external importer of ``PgMembership`` has to follow the move.
  - postgresql_membership - add the ``grants`` and ``effective_options`` return values, reporting every grant of the requested pairs and the options the target role effectively holds.
  - postgresql_membership - add the ``memberships`` option, naming one membership per row so that the granting role and the membership options can differ between them, which the top-level parameters cannot express because they name one value for the whole task. The whole task stays one transaction, unlike a loop over the module. It is mutually exclusive with ``groups``, ``granted_by`` and the three option parameters, since those describe a single membership; ``target_roles`` may still be given at the top level as the default for the rows that do not name their own.
  - postgresql_membership - check that the granting role holds ``ADMIN OPTION`` on every group about to be granted before emitting anything, and fail naming the roles that do hold it, separating a group whose ``ADMIN OPTION`` is held by a role that can be named instead, one where it is held only out of reach, and one where no role holds it at all. Left to the server, the refusal arrives partway through the transaction and takes the grants already made with it. Only the groups a ``GRANT`` is actually emitted for are checked, so a task with nothing left to do keeps succeeding. PostgreSQL waives the requirement for the bootstrap superuser only, so being connected as some other superuser does not skip the check.
  - postgresql_membership - check that the connecting role has the privileges of the ``granted_by`` role before recording a grant as that role or revoking one recorded under it, and report that rather than the server's error. Checked only when a statement is emitted, so a task with nothing left to do keeps succeeding.

bugfixes:
  - postgresql_membership - fix the module not recognizing its own grant on PostgreSQL 16 and later unless connected as the bootstrap superuser. ``state=present`` reported a change on every run and ``state=absent`` issued no ``REVOKE`` at all.
  - postgresql_membership - fix a group named more than once being granted or revoked twice, which emitted the statement twice and listed the target role twice in ``granted`` or ``revoked``.
  - postgresql_membership - fix an empty ``target_roles`` list failing with a SQL syntax error; it is now a no-op, as an empty ``groups`` list already was.
  - postgresql_membership - fix a group or role whose name contains a single or double quote producing invalid SQL. Names are now passed as query parameters or quoted as identifiers instead of being interpolated raw.
