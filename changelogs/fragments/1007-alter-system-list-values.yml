bugfixes:
  - postgresql_alter_system - rejected an empty value for every list parameter with the GUC_LIST_QUOTE flag, not only for ``shared_preload_libraries``. PostgreSQL stored it as a list with one element with an empty name, so for example ``session_preload_libraries`` made every new connection fail (https://github.com/ansible-collections/community.postgresql/pull/1007).
  - postgresql_alter_system - escaped single quotes and backslashes in the value passed to ``ALTER SYSTEM SET``, so values such as ``archive_command`` with quoted paths no longer caused a syntax error (https://github.com/ansible-collections/community.postgresql/pull/1007).
  - postgresql_alter_system - split a value containing commas into a list only for list parameters with the GUC_LIST_QUOTE flag. Other values, such as a comma-separated ``ssl_ciphers`` list, a POSIX ``TimeZone`` or a multi-host ``primary_conninfo``, were passed as one value instead of failing with ``takes only one argument`` (https://github.com/ansible-collections/community.postgresql/pull/1007).
  - postgresql_alter_system - parsed the elements of a GUC_LIST_QUOTE list value honoring double quotes and ignoring empty elements, so a trailing comma no longer failed with ``IndexError`` (https://github.com/ansible-collections/community.postgresql/pull/1007).
