####################################################################
# CREATE EXTENSION ... WITH SCHEMA interpolated the schema name    #
# between hand-written quotes, so a double quote in it produced    #
# invalid SQL. The statement also carries query parameters, so a   #
# per cent sign in the name must survive psycopg's substitution.   #
# The extension name itself has to match an installed control      #
# file, so it is the schema name that carries both characters.     #
####################################################################

- vars:
    test_ext: dummy
    test_schema: 'sc"he%ma'
    task_parameters: &task_parameters
      become_user: '{{ pg_user }}'
      become: true
      register: result
    pg_parameters: &pg_parameters
      login_user: '{{ pg_user }}'
      login_db: postgres

  block:

  - name: postgresql_ext_quoted_names - create a schema whose name contains a double quote and a per cent sign
    <<: *task_parameters
    postgresql_schema:
      <<: *pg_parameters
      name: '{{ test_schema }}'

  # A version adds a VERSION %(ver)s parameter to the statement.
  - name: postgresql_ext_quoted_names - create the extension in that schema in check_mode
    <<: *task_parameters
    postgresql_ext:
      <<: *pg_parameters
      name: '{{ test_ext }}'
      schema: '{{ test_schema }}'
      version: '1.0'
    check_mode: true

  - assert:
      that:
      - result is changed
      - result.queries == ["CREATE EXTENSION \"dummy\" WITH SCHEMA \"sc\"\"he%ma\" VERSION '1.0'"]

  - name: postgresql_ext_quoted_names - check mode created nothing
    <<: *task_parameters
    postgresql_query:
      <<: *pg_parameters
      query: "SELECT 1 FROM pg_catalog.pg_extension WHERE extname = %s"
      positional_args:
      - '{{ test_ext }}'

  - assert:
      that:
      - result.rowcount == 0

  - name: postgresql_ext_quoted_names - create the extension in that schema
    <<: *task_parameters
    postgresql_ext:
      <<: *pg_parameters
      name: '{{ test_ext }}'
      schema: '{{ test_schema }}'
      version: '1.0'

  - assert:
      that:
      - result is changed
      - result.queries == ["CREATE EXTENSION \"dummy\" WITH SCHEMA \"sc\"\"he%ma\" VERSION '1.0'"]

  - name: postgresql_ext_quoted_names - the extension is in the schema with the literal name
    <<: *task_parameters
    postgresql_query:
      <<: *pg_parameters
      query: >-
        SELECT n.nspname, e.extversion
        FROM pg_catalog.pg_extension AS e
        JOIN pg_catalog.pg_namespace AS n ON e.extnamespace = n.oid
        WHERE e.extname = %s
      positional_args:
      - '{{ test_ext }}'

  - assert:
      that:
      - result.rowcount == 1
      - result.query_result[0].nspname == test_schema
      - result.query_result[0].extversion == '1.0'

  - name: postgresql_ext_quoted_names - creating it again is idempotent
    <<: *task_parameters
    postgresql_ext:
      <<: *pg_parameters
      name: '{{ test_ext }}'
      schema: '{{ test_schema }}'
      version: '1.0'

  - assert:
      that:
      - result is not changed
      - result.queries == []

  - name: postgresql_ext_quoted_names - drop the extension
    <<: *task_parameters
    postgresql_ext:
      <<: *pg_parameters
      name: '{{ test_ext }}'
      state: absent

  - assert:
      that:
      - result is changed
      - result.queries == ["DROP EXTENSION \"dummy\""]

  # Without a version the statement still runs with an empty params dict,
  # which psycopg substitutes over as well.
  - name: postgresql_ext_quoted_names - create the extension in that schema without a version
    <<: *task_parameters
    postgresql_ext:
      <<: *pg_parameters
      name: '{{ test_ext }}'
      schema: '{{ test_schema }}'

  - assert:
      that:
      - result is changed
      - result.queries == ["CREATE EXTENSION \"dummy\" WITH SCHEMA \"sc\"\"he%ma\""]

  - name: postgresql_ext_quoted_names - the extension is in the schema with the literal name again
    <<: *task_parameters
    postgresql_query:
      <<: *pg_parameters
      query: >-
        SELECT n.nspname, e.extversion
        FROM pg_catalog.pg_extension AS e
        JOIN pg_catalog.pg_namespace AS n ON e.extnamespace = n.oid
        WHERE e.extname = %s
      positional_args:
      - '{{ test_ext }}'

  - assert:
      that:
      - result.rowcount == 1
      - result.query_result[0].nspname == test_schema
      - result.query_result[0].extversion == '4.0'

  always:

  - name: postgresql_ext_quoted_names - drop the extension
    <<: *task_parameters
    postgresql_ext:
      <<: *pg_parameters
      name: '{{ test_ext }}'
      state: absent
    ignore_errors: true

  - name: postgresql_ext_quoted_names - drop the schema
    <<: *task_parameters
    postgresql_schema:
      <<: *pg_parameters
      name: '{{ test_schema }}'
      state: absent
      cascade_drop: true
    ignore_errors: true
