####################################################################
# Documented input handling and return-value shape that no other   #
# task file covers: quoting of awkward names, repeated and empty   #
# lists, the order of the queries return value, and the two        #
# validation paths that warn or fail.                              #
####################################################################

- name: postgresql_membership - input handling
  block:

  - name: postgresql_membership - create roles for the input tests
    become_user: "{{ pg_user }}"
    become: true
    postgresql_user:
      login_user: "{{ pg_user }}"
      db: postgres
      name: "{{ item }}"
    with_items:
    - "in_group1"
    - "in_group2"
    - "in_user1"
    - "in_user2"
    - "o'brien"

  # A single quote is what actually broke the old code: it built the existence check as
  # IN ('name') by interpolation, so the name closed the literal early and the statement
  # was invalid. The name is passed as a query parameter now.
  - name: postgresql_membership - grant to a role whose name contains a single quote
    become_user: "{{ pg_user }}"
    become: true
    postgresql_membership:
      login_user: "{{ pg_user }}"
      db: postgres
      group: "in_group1"
      target_role: "o'brien"
      state: present
    register: result

  - assert:
      that:
      - result is changed
      - result.queries == ['GRANT "in_group1" TO "o\'brien"' ~ granted_by_sql]

  - name: postgresql_membership - the membership really exists under the literal name
    become_user: "{{ pg_user }}"
    become: true
    postgresql_query:
      login_user: "{{ pg_user }}"
      db: postgres
      query: >-
        SELECT count(*) AS count FROM pg_catalog.pg_auth_members m
        JOIN pg_catalog.pg_roles g ON m.roleid = g.oid
        JOIN pg_catalog.pg_roles u ON m.member = u.oid
        WHERE g.rolname = 'in_group1' AND u.rolname = %s
      positional_args:
      - "o'brien"
    register: result

  - assert:
      that:
      - result.query_result[0].count == 1

  - name: postgresql_membership - revoke it again
    become_user: "{{ pg_user }}"
    become: true
    postgresql_membership:
      login_user: "{{ pg_user }}"
      db: postgres
      group: "in_group1"
      target_role: "o'brien"
      state: absent
    register: result

  - assert:
      that:
      - result is changed
      - result.queries == ['REVOKE "in_group1" FROM "o\'brien"' ~ granted_by_sql]

  # A name repeated in the list is processed once, not once per occurrence.
  - name: postgresql_membership - a group named twice is granted once
    become_user: "{{ pg_user }}"
    become: true
    postgresql_membership:
      login_user: "{{ pg_user }}"
      db: postgres
      groups:
      - "in_group1"
      - "in_group1"
      target_role: "in_user1"
      state: present
    register: result

  - assert:
      that:
      - result is changed
      - result.queries == ['GRANT "in_group1" TO "in_user1"' ~ granted_by_sql]
      - 'result.granted == {"in_group1": ["in_user1"]}'

  # queries is ordered by target role and then by group, because each role's memberships
  # are read once rather than once per pair.
  - name: postgresql_membership - queries are ordered by target role, then by group
    become_user: "{{ pg_user }}"
    become: true
    postgresql_membership:
      login_user: "{{ pg_user }}"
      db: postgres
      groups:
      - "in_group1"
      - "in_group2"
      target_roles:
      - "in_user2"
      - "in_user1"
      state: present
    register: result

  - assert:
      that:
      - result is changed
      # in_user1 already has in_group1 from the task above, so only three are emitted,
      # and they still come out grouped by target role in the order asked for.
      - result.queries == ['GRANT "in_group1" TO "in_user2"' ~ granted_by_sql,
                           'GRANT "in_group2" TO "in_user2"' ~ granted_by_sql,
                           'GRANT "in_group2" TO "in_user1"' ~ granted_by_sql]

  # An empty target_roles list is a no-op, and granted still reports an entry for every
  # group that was asked about.
  - name: postgresql_membership - an empty target_roles list is a no-op
    become_user: "{{ pg_user }}"
    become: true
    postgresql_membership:
      login_user: "{{ pg_user }}"
      db: postgres
      groups:
      - "in_group1"
      - "in_group2"
      target_roles: []
      state: present
    register: result

  - assert:
      that:
      - result is not changed
      - result.queries == []
      - 'result.granted == {"in_group1": [], "in_group2": []}'

  # Membership options describe a grant, so they cannot apply to a revoke.
  - name: postgresql_membership - an option with state=absent warns that it is ignored
    become_user: "{{ pg_user }}"
    become: true
    postgresql_membership:
      login_user: "{{ pg_user }}"
      db: postgres
      group: "in_group1"
      target_role: "in_user1"
      admin_option: true
      state: absent
    register: result

  - assert:
      that:
      - result.warnings | select('search', 'have no effect with state=absent') | list | length > 0

  always:

  - name: postgresql_membership - drop roles from the input tests
    become_user: "{{ pg_user }}"
    become: true
    postgresql_user:
      login_user: "{{ pg_user }}"
      db: postgres
      name: "{{ item }}"
      state: absent
    ignore_errors: true
    with_items:
    - "o'brien"
    - "in_user1"
    - "in_user2"
    - "in_group1"
    - "in_group2"

####################################################################
# granted_by only exists from PostgreSQL 16 on, and the role it     #
# names must exist regardless of fail_on_role.                      #
####################################################################

- name: postgresql_membership - granted_by validation (PostgreSQL >= 16 only)
  when: pg_ver_num | int >= 160000
  block:

  - name: postgresql_membership - create roles for the granted_by validation test
    become_user: "{{ pg_user }}"
    become: true
    postgresql_user:
      login_user: "{{ pg_user }}"
      db: postgres
      name: "{{ item }}"
    with_items:
    - "gbv_group"
    - "gbv_user"

  - name: postgresql_membership - a granted_by role that does not exist is refused
    become_user: "{{ pg_user }}"
    become: true
    postgresql_membership:
      login_user: "{{ pg_user }}"
      db: postgres
      group: "gbv_group"
      target_role: "gbv_user"
      granted_by: "gbv_absent"
      state: present
    register: result
    ignore_errors: true

  - assert:
      that:
      - result is failed
      - "'The granted_by role gbv_absent does not exist' in result.msg"

  # fail_on_role covers groups and target_roles only, so it does not soften this.
  - name: postgresql_membership - and fail_on_role=false does not soften that
    become_user: "{{ pg_user }}"
    become: true
    postgresql_membership:
      login_user: "{{ pg_user }}"
      db: postgres
      group: "gbv_group"
      target_role: "gbv_user"
      granted_by: "gbv_absent"
      fail_on_role: false
      state: present
    register: result
    ignore_errors: true

  - assert:
      that:
      - result is failed

  always:

  - name: postgresql_membership - drop roles from the granted_by validation test
    become_user: "{{ pg_user }}"
    become: true
    postgresql_user:
      login_user: "{{ pg_user }}"
      db: postgres
      name: "{{ item }}"
      state: absent
    ignore_errors: true
    with_items:
    - "gbv_user"
    - "gbv_group"
