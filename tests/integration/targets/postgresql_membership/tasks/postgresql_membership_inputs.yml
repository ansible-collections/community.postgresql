####################################################################
# Documented input handling and return-value shape that no other   #
# task file covers: quoting of awkward names, repeated and empty   #
# lists, the order of the queries return value, and the two        #
# validation paths that warn or fail.                              #
####################################################################

- name: postgresql_membership - input handling
  vars:
    # Groups and granting roles first: dropping in reverse then removes the
    # members before the roles that granted to them.
    roles:
    - "in_group1"
    - "in_group2"
    - "in_user1"
    - "in_user2"
    - "o'brien"
  block:

  - name: postgresql_membership - create roles for the input tests
    become_user: "{{ pg_user }}"
    become: true
    postgresql_user:
      login_user: "{{ pg_user }}"
      db: postgres
      name: "{{ item }}"
    with_items: "{{ roles }}"

  # A single quote closes an interpolated SQL literal early, so the name has to go in
  # as a query parameter.
  - name: postgresql_membership - grant to a role whose name contains a single quote
    become_user: "{{ pg_user }}"
    become: true
    postgresql_membership:
      login_user: "{{ pg_user }}"
      db: postgres
      group: "in_group1"
      target_role: "o'brien"
      state: present
    register: result

  - assert:
      that:
      - result is changed
      - result.queries == ['GRANT "in_group1" TO "o\'brien"']

  - name: postgresql_membership - the membership really exists under the literal name
    become_user: "{{ pg_user }}"
    become: true
    postgresql_query:
      login_user: "{{ pg_user }}"
      db: postgres
      query: "{{ q_grant_count }}"
      positional_args:
      - "in_group1"
      - "o'brien"
    register: result

  - assert:
      that:
      - result.query_result[0].count == 1

  - name: postgresql_membership - revoke it again
    become_user: "{{ pg_user }}"
    become: true
    postgresql_membership:
      login_user: "{{ pg_user }}"
      db: postgres
      group: "in_group1"
      target_role: "o'brien"
      state: absent
    register: result

  - assert:
      that:
      - result is changed
      - result.queries == ['REVOKE "in_group1" FROM "o\'brien"' ~ granted_by_sql]

  # A name repeated in the list is processed once, not once per occurrence.
  - name: postgresql_membership - a group named twice is granted once
    become_user: "{{ pg_user }}"
    become: true
    postgresql_membership:
      login_user: "{{ pg_user }}"
      db: postgres
      groups:
      - "in_group1"
      - "in_group1"
      target_role: "in_user1"
      state: present
    register: result

  - assert:
      that:
      - result is changed
      - result.queries == ['GRANT "in_group1" TO "in_user1"']
      - 'result.granted == {"in_group1": ["in_user1"]}'

  # queries is ordered by target role and then by group, the order the (group, target
  # role) pairs are walked in. The deprecated form's GRANT names no granting role, so
  # there is no clause to expect on PostgreSQL 16 either.
  - name: postgresql_membership - queries are ordered by target role, then by group
    become_user: "{{ pg_user }}"
    become: true
    postgresql_membership:
      login_user: "{{ pg_user }}"
      db: postgres
      groups:
      - "in_group1"
      - "in_group2"
      target_roles:
      - "in_user2"
      - "in_user1"
      state: present
    register: result

  - assert:
      that:
      - result is changed
      # in_user1 already has in_group1 from the task above, so only three are emitted,
      # and they still come out grouped by target role in the order asked for.
      - result.queries == ['GRANT "in_group1" TO "in_user2"',
                           'GRANT "in_group2" TO "in_user2"',
                           'GRANT "in_group2" TO "in_user1"']

  # An empty target_roles list is a no-op, and granted still reports an entry for every
  # group that was asked about.
  - name: postgresql_membership - an empty target_roles list is a no-op
    become_user: "{{ pg_user }}"
    become: true
    postgresql_membership:
      login_user: "{{ pg_user }}"
      db: postgres
      groups:
      - "in_group1"
      - "in_group2"
      target_roles: []
      state: present
    register: result

  - assert:
      that:
      - result is not changed
      - result.queries == []
      - 'result.granted == {"in_group1": [], "in_group2": []}'

  # Membership options describe a grant, so they cannot apply to a revoke.
  - name: postgresql_membership - an option with state=absent warns that it is ignored
    become_user: "{{ pg_user }}"
    become: true
    postgresql_membership:
      login_user: "{{ pg_user }}"
      db: postgres
      memberships:
      - groups: "in_group1"
        admin_option: true
      target_role: "in_user1"
      state: absent
    register: result

  - assert:
      that:
      - result.warnings | select('search', 'have no effect with state=absent') | list | length > 0

  # required_one_of counts a key that is present, so a null value passes it and the
  # module has to refuse it itself instead of failing on iterating None.
  - name: postgresql_membership - a null groups is refused like a missing one
    become_user: "{{ pg_user }}"
    become: true
    postgresql_membership:
      login_user: "{{ pg_user }}"
      db: postgres
      groups:
      target_role: "in_user1"
      state: present
    register: result
    ignore_errors: true

  - assert:
      that:
      - result is failed
      - "'one of the following is required: groups, memberships' in result.msg"

  - name: postgresql_membership - a null memberships is refused the same way
    become_user: "{{ pg_user }}"
    become: true
    postgresql_membership:
      login_user: "{{ pg_user }}"
      db: postgres
      memberships:
      target_role: "in_user1"
      state: present
    register: result
    ignore_errors: true

  - assert:
      that:
      - result is failed
      - "'one of the following is required: groups, memberships' in result.msg"

  # granted_by_any describes what the deprecated groups option does anyway.
  - name: postgresql_membership - granted_by_any with the deprecated groups option is refused
    become_user: "{{ pg_user }}"
    become: true
    postgresql_membership:
      login_user: "{{ pg_user }}"
      db: postgres
      groups: "in_group2"
      target_role: "in_user2"
      granted_by_any: true
      state: present
    register: result
    ignore_errors: true

  - assert:
      that:
      - result is failed
      - "'granted_by_any applies to memberships' in result.msg"

  - name: postgresql_membership - make sure in_user2 is not a member of in_group2
    become_user: "{{ pg_user }}"
    become: true
    postgresql_query:
      login_user: "{{ pg_user }}"
      db: postgres
      query: 'REVOKE "in_group2" FROM "in_user2"'

  # The same statement on every version: granted_by_any names no granting role, so
  # this is the migration of a groups task that behaves the same before and after 16.
  - name: postgresql_membership - granted_by_any grants without a granting role on every version
    become_user: "{{ pg_user }}"
    become: true
    postgresql_membership:
      login_user: "{{ pg_user }}"
      db: postgres
      granted_by_any: true
      memberships:
      - groups: "in_group2"
      target_role: "in_user2"
      state: present
    register: result

  - assert:
      that:
      - result is changed
      - result.queries == ['GRANT "in_group2" TO "in_user2"']

  always:

  - name: postgresql_membership - drop roles from the input tests
    become_user: "{{ pg_user }}"
    become: true
    postgresql_user:
      login_user: "{{ pg_user }}"
      db: postgres
      name: "{{ item }}"
      state: absent
    ignore_errors: true
    with_items: "{{ roles | reverse | list }}"

####################################################################
# granted_by only exists from PostgreSQL 16 on, and the role it     #
# names must exist regardless of fail_on_role.                      #
####################################################################

- name: postgresql_membership - granted_by validation (PostgreSQL >= 16 only)
  when: pg_per_grantor | bool
  vars:
    # Groups and granting roles first: dropping in reverse then removes the
    # members before the roles that granted to them.
    roles:
    - "gbv_group"
    - "gbv_user"
  block:

  - name: postgresql_membership - create roles for the granted_by validation test
    become_user: "{{ pg_user }}"
    become: true
    postgresql_user:
      login_user: "{{ pg_user }}"
      db: postgres
      name: "{{ item }}"
    with_items: "{{ roles }}"

  - name: postgresql_membership - a granted_by role that does not exist is refused
    become_user: "{{ pg_user }}"
    become: true
    postgresql_membership:
      login_user: "{{ pg_user }}"
      db: postgres
      memberships:
      - groups: "gbv_group"
        granted_by: "gbv_absent"
      target_role: "gbv_user"
      state: present
    register: result
    ignore_errors: true

  - assert:
      that:
      - result is failed
      - "'The granted_by role gbv_absent does not exist' in result.msg"

  # fail_on_role covers groups and target_roles only, so it does not soften this.
  - name: postgresql_membership - and fail_on_role=false does not soften that
    become_user: "{{ pg_user }}"
    become: true
    postgresql_membership:
      login_user: "{{ pg_user }}"
      db: postgres
      memberships:
      - groups: "gbv_group"
        granted_by: "gbv_absent"
      target_role: "gbv_user"
      fail_on_role: false
      state: present
    register: result
    ignore_errors: true

  - assert:
      that:
      - result is failed

  always:

  - name: postgresql_membership - drop roles from the granted_by validation test
    become_user: "{{ pg_user }}"
    become: true
    postgresql_user:
      login_user: "{{ pg_user }}"
      db: postgres
      name: "{{ item }}"
      state: absent
    ignore_errors: true
    with_items: "{{ roles | reverse | list }}"
