####################################################################
# Tests for the granting role a memberships row names when the     #
# connecting role is not a superuser, and for the deprecated       #
# groups form, which names none and lets PostgreSQL pick one.      #
# session_role is what makes that case reachable here:             #
# CURRENT_ROLE follows SET ROLE, so the module resolves the        #
# granting role for the session role rather than for login_user,   #
# even though login_user is a superuser.                           #
####################################################################

- name: postgresql_membership - non-superuser granting role (PostgreSQL >= 16 only)
  when: pg_ver_num | int >= 160000
  block:

  - name: postgresql_membership - create roles for the session_role tests
    become_user: "{{ pg_user }}"
    become: true
    postgresql_user:
      login_user: "{{ pg_user }}"
      db: postgres
      name: "{{ item }}"
    with_items:
    - "sr_group"
    - "sr_member"
    - "sr_direct"
    - "sr_team"
    - "sr_indirect"
    - "sr_own"
    - "sr_nogrant"
    - "sr_member2"
    - "sr_member3"
    - "sr_usage_grp"
    - "sr_usage_holder"

  # sr_direct holds ADMIN OPTION on sr_group itself. sr_indirect only reaches it
  # through sr_team, which is the case PostgreSQL refuses to record under the
  # connecting role. sr_own is the group sr_indirect can grant on its own, and
  # sr_nogrant the one no role it can assume holds ADMIN OPTION on.
  - name: postgresql_membership - give sr_direct and sr_team ADMIN OPTION, sr_indirect only inheritance
    become_user: "{{ pg_user }}"
    become: true
    postgresql_query:
      login_user: "{{ pg_user }}"
      db: postgres
      query: "{{ item }}"
    with_items:
    - 'GRANT "sr_group" TO "sr_direct" WITH ADMIN OPTION'
    - 'GRANT "sr_group" TO "sr_team" WITH ADMIN OPTION'
    - 'GRANT "sr_team" TO "sr_indirect" WITH INHERIT TRUE'
    - 'GRANT "sr_own" TO "sr_indirect" WITH ADMIN OPTION'
    - 'GRANT "sr_nogrant" TO "sr_direct" WITH ADMIN OPTION'
    # sr_indirect has sr_usage_holder's privileges but cannot SET ROLE to it, which
    # is the case where has_privs_of_role and SET ROLE disagree.
    - 'GRANT "sr_usage_grp" TO "sr_usage_holder" WITH ADMIN OPTION'
    - 'GRANT "sr_usage_holder" TO "sr_indirect" WITH INHERIT TRUE, SET FALSE'

  # The deprecated form names no granting role. PostgreSQL records the grant under
  # the connecting role, which holds ADMIN OPTION directly, and the REVOKE names
  # what it finds recorded.
  - name: postgresql_membership - grant as a non-superuser holding ADMIN OPTION directly
    become_user: "{{ pg_user }}"
    become: true
    postgresql_membership:
      login_user: "{{ pg_user }}"
      session_role: "sr_direct"
      db: postgres
      group: "sr_group"
      target_role: "sr_member"
      state: present
    register: result

  - assert:
      that:
      - result is changed
      - result.queries == ['GRANT "sr_group" TO "sr_member"']
      - result.grants.sr_group.sr_member | map(attribute='grantor') | list == ["sr_direct"]

  - name: postgresql_membership - and it is idempotent
    become_user: "{{ pg_user }}"
    become: true
    postgresql_membership:
      login_user: "{{ pg_user }}"
      session_role: "sr_direct"
      db: postgres
      group: "sr_group"
      target_role: "sr_member"
      state: present
    register: result

  - assert:
      that:
      - result is not changed
      - result.queries == []

  - name: postgresql_membership - revoke it again as the same role
    become_user: "{{ pg_user }}"
    become: true
    postgresql_membership:
      login_user: "{{ pg_user }}"
      session_role: "sr_direct"
      db: postgres
      group: "sr_group"
      target_role: "sr_member"
      state: absent
    register: result

  - assert:
      that:
      - result is changed
      - result.queries == ['REVOKE "sr_group" FROM "sr_member" GRANTED BY "sr_direct"']

  # The regression the pair identity fixes: the deprecated form has nothing to name
  # a granting role with, and PostgreSQL picks one that holds ADMIN OPTION, here
  # sr_team. Naming the connecting role instead would have been refused, since it
  # holds the option only through sr_team.
  - name: postgresql_membership - grant as a non-superuser holding ADMIN OPTION only indirectly
    become_user: "{{ pg_user }}"
    become: true
    postgresql_membership:
      login_user: "{{ pg_user }}"
      session_role: "sr_indirect"
      db: postgres
      group: "sr_group"
      target_role: "sr_member"
      state: present
    register: result

  - assert:
      that:
      - result is changed
      - result.queries == ['GRANT "sr_group" TO "sr_member"']
      - result.grants.sr_group.sr_member | map(attribute='grantor') | list == ["sr_team"]

  - name: postgresql_membership - and that is idempotent
    become_user: "{{ pg_user }}"
    become: true
    postgresql_membership:
      login_user: "{{ pg_user }}"
      session_role: "sr_indirect"
      db: postgres
      group: "sr_group"
      target_role: "sr_member"
      state: present
    register: result

  - assert:
      that:
      - result is not changed
      - result.queries == []

  # absent revokes the grant under whatever role PostgreSQL recorded it under.
  - name: postgresql_membership - absent removes the grant PostgreSQL recorded under sr_team
    become_user: "{{ pg_user }}"
    become: true
    postgresql_membership:
      login_user: "{{ pg_user }}"
      session_role: "sr_indirect"
      db: postgres
      group: "sr_group"
      target_role: "sr_member"
      state: absent
    register: result

  - assert:
      that:
      - result is changed
      - result.queries == ['REVOKE "sr_group" FROM "sr_member" GRANTED BY "sr_team"']

  - name: postgresql_membership - nothing is left of it
    become_user: "{{ pg_user }}"
    become: true
    postgresql_query:
      login_user: "{{ pg_user }}"
      db: postgres
      query: "{{ q_grant_count }}"
      positional_args:
      - "sr_group"
      - "sr_member"
    register: result

  - assert:
      that:
      - result.query_result[0].count == 0

  # The documented breaking change of the memberships form: a row names the
  # connecting role, and PostgreSQL refuses that when the role only inherits ADMIN
  # OPTION. Reported by the module before anything is emitted, naming the role that
  # does hold the option rather than passing the server's error through.
  - name: postgresql_membership - the same membership as a row names sr_indirect, and is refused
    become_user: "{{ pg_user }}"
    become: true
    postgresql_membership:
      login_user: "{{ pg_user }}"
      session_role: "sr_indirect"
      db: postgres
      memberships:
      - groups: "sr_group"
      target_role: "sr_member"
      state: present
    register: result
    ignore_errors: true

  - assert:
      that:
      - result is failed
      - '''The granting role "sr_indirect" does not hold ADMIN OPTION on "sr_group"'' in result.msg'
      - "'sr_group: sr_team' in result.msg"

  - name: postgresql_membership - nothing was granted by the failed run
    become_user: "{{ pg_user }}"
    become: true
    postgresql_query:
      login_user: "{{ pg_user }}"
      db: postgres
      query: "{{ q_grant_count }}"
      positional_args:
      - "sr_group"
      - "sr_member"
    register: result

  - assert:
      that:
      - result.query_result[0].count == 0

  # A group nobody the connecting role can assume holds ADMIN OPTION on. granted_by
  # cannot fix it, so the message must not suggest it.
  - name: postgresql_membership - grant a group no assumable role holds ADMIN OPTION on
    become_user: "{{ pg_user }}"
    become: true
    postgresql_membership:
      login_user: "{{ pg_user }}"
      session_role: "sr_indirect"
      db: postgres
      memberships:
      - groups: "sr_nogrant"
      target_role: "sr_member"
      state: present
    register: result
    ignore_errors: true

  - assert:
      that:
      - result is failed
      - '''ADMIN OPTION on "sr_nogrant" is held only by roles'' in result.msg'
      - "'sr_nogrant: sr_direct' in result.msg"
      - "'Set granted_by' not in result.msg"

  # The reviewed defect: one granting role for a row naming several groups. The
  # grantable group must not be granted, since the refusal of the other one takes the
  # whole transaction down with it.
  - name: postgresql_membership - a row mixing a grantable and a non-grantable group fails
    become_user: "{{ pg_user }}"
    become: true
    postgresql_membership:
      login_user: "{{ pg_user }}"
      session_role: "sr_indirect"
      db: postgres
      memberships:
      - groups:
        - "sr_own"
        - "sr_group"
      target_role: "sr_member"
      state: present
    register: result
    ignore_errors: true

  - assert:
      that:
      - result is failed
      - '''does not hold ADMIN OPTION on "sr_group"'' in result.msg'
      - "'given a row each' in result.msg"

  - name: postgresql_membership - the grantable group of the failed row was left alone
    become_user: "{{ pg_user }}"
    become: true
    postgresql_query:
      login_user: "{{ pg_user }}"
      db: postgres
      query: "{{ q_grant_count }}"
      positional_args:
      - "sr_own"
      - "sr_member"
    register: result

  - assert:
      that:
      - result.query_result[0].count == 0

  # Giving the grantable group a row of its own is the documented way out, so that
  # row has to work alone.
  - name: postgresql_membership - the grantable group succeeds in a row of its own
    become_user: "{{ pg_user }}"
    become: true
    postgresql_membership:
      login_user: "{{ pg_user }}"
      session_role: "sr_indirect"
      db: postgres
      memberships:
      - groups: "sr_own"
      target_role: "sr_member"
      state: present
    register: result

  - assert:
      that:
      - result is changed
      - result.queries == ['GRANT "sr_own" TO "sr_member" GRANTED BY "sr_indirect"']

  # The other way out: a row per granting role, still one task and so still one
  # transaction.
  - name: postgresql_membership - the same mix succeeds as two memberships rows
    become_user: "{{ pg_user }}"
    become: true
    postgresql_membership:
      login_user: "{{ pg_user }}"
      session_role: "sr_indirect"
      db: postgres
      target_role: "sr_member3"
      memberships:
      - groups: "sr_own"
      - groups: "sr_group"
        granted_by: "sr_team"
      state: present
    register: result

  - assert:
      that:
      - result is changed
      - result.queries == ['GRANT "sr_own" TO "sr_member3" GRANTED BY "sr_indirect"',
                           'GRANT "sr_group" TO "sr_member3" GRANTED BY "sr_team"']
      - result.grants.sr_own.sr_member3 | map(attribute='grantor') | list == ["sr_indirect"]
      - result.grants.sr_group.sr_member3 | map(attribute='grantor') | list == ["sr_team"]

  - name: postgresql_membership - and the two rows are idempotent together
    become_user: "{{ pg_user }}"
    become: true
    postgresql_membership:
      login_user: "{{ pg_user }}"
      session_role: "sr_indirect"
      db: postgres
      target_role: "sr_member3"
      memberships:
      - groups: "sr_own"
      - groups: "sr_group"
        granted_by: "sr_team"
      state: present
    register: result

  - assert:
      that:
      - result is not changed
      - result.queries == []

  # granted_by naming a role the connecting role has no privileges of is refused with
  # its own message, since no group is at fault.
  - name: postgresql_membership - granted_by naming an unassumable role
    become_user: "{{ pg_user }}"
    become: true
    postgresql_membership:
      login_user: "{{ pg_user }}"
      session_role: "sr_indirect"
      db: postgres
      memberships:
      - groups: "sr_group"
        granted_by: "sr_direct"
      target_role: "sr_member"
      state: present
    register: result
    ignore_errors: true

  - assert:
      that:
      - result is failed
      - "'does not have the privileges of that role' in result.msg"

  # granted_by naming the role that actually holds ADMIN OPTION is the documented fix.
  - name: postgresql_membership - the same task succeeds with granted_by
    become_user: "{{ pg_user }}"
    become: true
    postgresql_membership:
      login_user: "{{ pg_user }}"
      session_role: "sr_indirect"
      db: postgres
      memberships:
      - groups: "sr_group"
        granted_by: "sr_team"
      target_role: "sr_member"
      state: present
    register: result

  - assert:
      that:
      - result is changed
      - result.queries == ['GRANT "sr_group" TO "sr_member" GRANTED BY "sr_team"']
      - result.grants.sr_group.sr_member | map(attribute='grantor') | list == ["sr_team"]

  - name: postgresql_membership - granted_by is idempotent for a non-superuser too
    become_user: "{{ pg_user }}"
    become: true
    postgresql_membership:
      login_user: "{{ pg_user }}"
      session_role: "sr_indirect"
      db: postgres
      memberships:
      - groups: "sr_group"
        granted_by: "sr_team"
      target_role: "sr_member"
      state: present
    register: result

  - assert:
      that:
      - result is not changed
      - result.queries == []

  # PostgreSQL asks that the connecting role have the privileges of the granting
  # role, which is has_privs_of_role rather than SET ROLE. A grantor reachable by
  # inheritance alone is therefore usable, and a check written against SET ROLE
  # would refuse this grant that the server accepts.
  - name: postgresql_membership - a granting role reachable by inheritance alone is usable
    become_user: "{{ pg_user }}"
    become: true
    postgresql_membership:
      login_user: "{{ pg_user }}"
      session_role: "sr_indirect"
      db: postgres
      target_role: "sr_member"
      memberships:
      - groups: "sr_usage_grp"
        granted_by: "sr_usage_holder"
      state: present
    register: result

  - assert:
      that:
      - result is changed
      - result.queries == ['GRANT "sr_usage_grp" TO "sr_member" GRANTED BY "sr_usage_holder"']

  # Only the groups a GRANT is emitted for are checked, so a converged task keeps
  # succeeding after the connecting role lost the privileges of the granting role.
  # Failing here would turn a settled playbook red without anything to change.
  - name: postgresql_membership - take the privileges of sr_team away from sr_indirect
    become_user: "{{ pg_user }}"
    become: true
    postgresql_query:
      login_user: "{{ pg_user }}"
      db: postgres
      query: 'REVOKE "sr_team" FROM "sr_indirect"'

  - name: postgresql_membership - a converged task survives an unusable granting role
    become_user: "{{ pg_user }}"
    become: true
    postgresql_membership:
      login_user: "{{ pg_user }}"
      session_role: "sr_indirect"
      db: postgres
      memberships:
      - groups: "sr_group"
        granted_by: "sr_team"
      target_role: "sr_member"
      state: present
    register: result

  - assert:
      that:
      - result is not changed
      - result.queries == []

  - name: postgresql_membership - but the same task with work to do is reported
    become_user: "{{ pg_user }}"
    become: true
    postgresql_membership:
      login_user: "{{ pg_user }}"
      session_role: "sr_indirect"
      db: postgres
      memberships:
      - groups: "sr_group"
        granted_by: "sr_team"
      target_role: "sr_member2"
      state: present
    register: result
    ignore_errors: true

  - assert:
      that:
      - result is failed
      - "'does not have the privileges of that role' in result.msg"

  # Revoking a grant recorded under another role needs that role's privileges too,
  # which is the loop used to remove the grants competing with the managed one.
  - name: postgresql_membership - revoking under an unusable granting role is reported
    become_user: "{{ pg_user }}"
    become: true
    postgresql_membership:
      login_user: "{{ pg_user }}"
      session_role: "sr_indirect"
      db: postgres
      memberships:
      - groups: "sr_group"
        granted_by: "sr_team"
      target_role: "sr_member"
      state: absent
    register: result
    ignore_errors: true

  - assert:
      that:
      - result is failed
      - "'cannot act as the granting role' in result.msg"
      - "'permission denied to revoke' not in result.msg"

  - name: postgresql_membership - the grant the revoke could not remove is still there
    become_user: "{{ pg_user }}"
    become: true
    postgresql_query:
      login_user: "{{ pg_user }}"
      db: postgres
      query: "{{ q_grant_count }}"
      positional_args:
      - "sr_group"
      - "sr_member"
    register: result

  - assert:
      that:
      - result.query_result[0].count == 1

  always:

  - name: postgresql_membership - drop roles from the session_role tests
    become_user: "{{ pg_user }}"
    become: true
    postgresql_user:
      login_user: "{{ pg_user }}"
      db: postgres
      name: "{{ item }}"
      state: absent
    ignore_errors: true
    with_items:
    - "sr_member"
    - "sr_member2"
    - "sr_member3"
    - "sr_usage_grp"
    - "sr_usage_holder"
    - "sr_indirect"
    - "sr_direct"
    - "sr_team"
    - "sr_group"
    - "sr_own"
    - "sr_nogrant"
    - "sr_usage_grp"
    - "sr_usage_holder"

####################################################################
# Before PostgreSQL 16 no granting role is named, so a non-superuser
# is not treated differently and granted_by is refused outright.
####################################################################

- name: postgresql_membership - non-superuser is unaffected before PostgreSQL 16
  when: pg_ver_num | int < 160000
  block:

  - name: postgresql_membership - create roles for the legacy session_role test
    become_user: "{{ pg_user }}"
    become: true
    postgresql_user:
      login_user: "{{ pg_user }}"
      db: postgres
      name: "{{ item }}"
    with_items:
    - "sr_group"
    - "sr_member"
    - "sr_direct"

  - name: postgresql_membership - give sr_direct ADMIN OPTION on sr_group
    become_user: "{{ pg_user }}"
    become: true
    postgresql_query:
      login_user: "{{ pg_user }}"
      db: postgres
      query: 'GRANT "sr_group" TO "sr_direct" WITH ADMIN OPTION'

  - name: postgresql_membership - grant as a non-superuser, no GRANTED BY emitted
    become_user: "{{ pg_user }}"
    become: true
    postgresql_membership:
      login_user: "{{ pg_user }}"
      session_role: "sr_direct"
      db: postgres
      group: "sr_group"
      target_role: "sr_member"
      state: present
    register: result

  - assert:
      that:
      - result is changed
      - result.queries == ['GRANT "sr_group" TO "sr_member"']

  always:

  - name: postgresql_membership - drop roles from the legacy session_role test
    become_user: "{{ pg_user }}"
    become: true
    postgresql_user:
      login_user: "{{ pg_user }}"
      db: postgres
      name: "{{ item }}"
      state: absent
    ignore_errors: true
    with_items:
    - "sr_member"
    - "sr_direct"
    - "sr_group"
