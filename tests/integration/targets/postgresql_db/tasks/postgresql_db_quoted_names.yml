####################################################################
# CREATE DATABASE names the database, owner and template, and      #
# ALTER DATABASE names the database and the rename target. All of  #
# them were interpolated raw, so a double quote in any of them      #
# produced invalid SQL.                                            #
####################################################################

- name: postgresql_db - quoted names
  block:

  - name: postgresql_db - create a role whose name contains a double quote
    become_user: "{{ pg_user }}"
    become: true
    postgresql_user:
      login_user: "{{ pg_user }}"
      db: postgres
      name: 'db"owner'

  - name: postgresql_db - create a database with a quoted name and owner
    become_user: "{{ pg_user }}"
    become: true
    postgresql_db:
      login_user: "{{ pg_user }}"
      name: 'q"db'
      owner: 'db"owner'
    register: result

  - assert:
      that:
      - result is changed

  - name: postgresql_db - it exists under the literal name with the literal owner
    become_user: "{{ pg_user }}"
    become: true
    postgresql_query:
      login_user: "{{ pg_user }}"
      db: postgres
      query: >-
        SELECT datname, pg_catalog.pg_get_userbyid(datdba) AS owner
        FROM pg_catalog.pg_database WHERE datname = %s
      positional_args:
      - 'q"db'
    register: result

  - assert:
      that:
      - result.rowcount == 1
      - result.query_result[0].owner == 'db"owner'

  # rename reaches ALTER DATABASE ... RENAME TO
  - name: postgresql_db - rename it to another quoted name
    become_user: "{{ pg_user }}"
    become: true
    postgresql_db:
      login_user: "{{ pg_user }}"
      name: 'q"db'
      target: 'q"db2'
      state: rename
    register: result

  - assert:
      that:
      - result is changed

  - name: postgresql_db - the rename landed on the literal name
    become_user: "{{ pg_user }}"
    become: true
    postgresql_query:
      login_user: "{{ pg_user }}"
      db: postgres
      query: "SELECT count(*) AS count FROM pg_catalog.pg_database WHERE datname = %s"
      positional_args:
      - 'q"db2'
    register: result

  - assert:
      that:
      - result.query_result[0].count == 1

  always:

  - name: postgresql_db - drop the quoted databases
    become_user: "{{ pg_user }}"
    become: true
    postgresql_db:
      login_user: "{{ pg_user }}"
      name: "{{ item }}"
      state: absent
    ignore_errors: true
    with_items:
    - 'q"db2'
    - 'q"db'

  - name: postgresql_db - drop the quoted owner
    become_user: "{{ pg_user }}"
    become: true
    postgresql_user:
      login_user: "{{ pg_user }}"
      db: postgres
      name: 'db"owner'
      state: absent
    ignore_errors: true
