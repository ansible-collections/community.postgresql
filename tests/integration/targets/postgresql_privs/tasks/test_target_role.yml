# Setup
- name: Create a test user
  become_user: "{{ pg_user }}"
  become: true
  postgresql_user:
    name: "{{ db_user1 }}"
    login_user: "{{ pg_user }}"
    login_db: postgres

- name: Create DB
  become_user: "{{ pg_user }}"
  become: true
  postgresql_db:
    state: present
    name: "{{ db_name }}"
    owner: "{{ db_user1 }}"
    login_user: "{{ pg_user }}"

- name: Create a user to be given permissions and other tests
  postgresql_user:
    name: "{{ db_user2 }}"
    state: present
    encrypted: true
    password: password
    role_attr_flags: LOGIN
    login_db: "{{ db_name }}"
    login_user: "{{ pg_user }}"

#######################################
# Test default_privs with target_role #
#######################################

# Test
- name: Grant default privileges for new table objects
  become_user: "{{ pg_user }}"
  become: true
  postgresql_privs:
    login_db: "{{ db_name }}"
    objs: TABLES
    privs: SELECT
    type: default_privs
    role: "{{ db_user2 }}"
    target_roles: "{{ db_user1 }}"
    login_user: "{{ pg_user }}"
  register: result

# Checks
- assert:
    that: result is changed

- name: Check that default privileges are set
  become: true
  become_user: "{{ pg_user }}"
  shell: psql {{ db_name }} -c "SELECT defaclrole, defaclobjtype, defaclacl FROM pg_default_acl a JOIN pg_roles b ON a.defaclrole=b.oid;" -t
  register: result

- assert:
    that: result.stdout_lines[0] is search('{{ db_user2 }}=r/{{ db_user1 }}')

# Test
- name: Revoke default privileges for new table objects
  become_user: "{{ pg_user }}"
  become: true
  postgresql_privs:
    login_db: "{{ db_name }}"
    state: absent
    objs: TABLES
    privs: SELECT
    type: default_privs
    role: "{{ db_user2 }}"
    target_roles: "{{ db_user1 }}"
    login_user: "{{ pg_user }}"
  register: result

# Checks
- assert:
    that: result is changed


###############################################
# Regression coverage for issue #582
###############################################

- name: Grant default table privileges for issue 582
  become_user: "{{ pg_user }}"
  become: true
  postgresql_privs:
    login_db: "{{ db_name }}"
    objs: TABLES
    privs: SELECT,TRUNCATE,TRIGGER
    type: default_privs
    role: "{{ db_user2 }}"
    target_roles: "{{ db_user1 }}"
    login_user: "{{ pg_user }}"
  register: result

- assert:
    that: result is changed

- name: Grant default sequence privileges for issue 582
  become_user: "{{ pg_user }}"
  become: true
  postgresql_privs:
    login_db: "{{ db_name }}"
    objs: SEQUENCES
    privs: USAGE
    type: default_privs
    role: "{{ db_user2 }}"
    target_roles: "{{ db_user1 }}"
    login_user: "{{ pg_user }}"
  register: result

- assert:
    that: result is changed

- name: Revoke only TRUNCATE and TRIGGER in check mode
  become_user: "{{ pg_user }}"
  become: true
  postgresql_privs:
    login_db: "{{ db_name }}"
    state: absent
    objs: TABLES
    privs: TRUNCATE,TRIGGER
    type: default_privs
    role: "{{ db_user2 }}"
    target_roles: "{{ db_user1 }}"
    login_user: "{{ pg_user }}"
  check_mode: true
  register: result

- assert:
    that: result is changed

- name: Verify selective default privilege state
  vars:
    default_privileges_query: |
      WITH privileges AS (
          SELECT d.defaclobjtype, acl.privilege_type
          FROM pg_default_acl AS d
          CROSS JOIN LATERAL pg_catalog.aclexplode(d.defaclacl) AS acl
          JOIN pg_roles AS target_role ON target_role.oid = d.defaclrole
          JOIN pg_roles AS grantee_role ON grantee_role.oid = acl.grantee
          WHERE d.defaclnamespace = (
              SELECT oid FROM pg_namespace WHERE nspname = 'public'
          )
            AND target_role.rolname = '{{ db_user1 }}'
            AND grantee_role.rolname = '{{ db_user2 }}'
      )
      SELECT
          EXISTS (
              SELECT 1 FROM privileges
              WHERE defaclobjtype = 'r' AND privilege_type = 'SELECT'
          ) AS table_select,
          EXISTS (
              SELECT 1 FROM privileges
              WHERE defaclobjtype = 'r' AND privilege_type = 'TRUNCATE'
          ) AS table_truncate,
          EXISTS (
              SELECT 1 FROM privileges
              WHERE defaclobjtype = 'r' AND privilege_type = 'TRIGGER'
          ) AS table_trigger,
          EXISTS (
              SELECT 1 FROM privileges
              WHERE defaclobjtype = 'S' AND privilege_type = 'USAGE'
          ) AS sequence_usage
  block:
    - name: Verify check mode preserved existing default privileges
      become_user: "{{ pg_user }}"
      become: true
      postgresql_query:
        login_db: "{{ db_name }}"
        login_user: "{{ pg_user }}"
        query: "{{ default_privileges_query }}"
      register: result

    - assert:
        that:
          - result.query_result[0].table_select
          - result.query_result[0].table_truncate
          - result.query_result[0].table_trigger
          - result.query_result[0].sequence_usage

    - name: Revoke only TRUNCATE and TRIGGER from default table privileges
      become_user: "{{ pg_user }}"
      become: true
      postgresql_privs:
        login_db: "{{ db_name }}"
        state: absent
        objs: TABLES
        privs: TRUNCATE,TRIGGER
        type: default_privs
        role: "{{ db_user2 }}"
        target_roles: "{{ db_user1 }}"
        login_user: "{{ pg_user }}"
      register: result

    - assert:
        that: result is changed

    - name: Verify selective default privilege revocation
      become_user: "{{ pg_user }}"
      become: true
      postgresql_query:
        login_db: "{{ db_name }}"
        login_user: "{{ pg_user }}"
        query: "{{ default_privileges_query }}"
      register: result

    - assert:
        that:
          - result.query_result[0].table_select
          - not result.query_result[0].table_truncate
          - not result.query_result[0].table_trigger
          - result.query_result[0].sequence_usage

- name: Check repeating selective default privilege revocation in check mode
  become_user: "{{ pg_user }}"
  become: true
  postgresql_privs:
    login_db: "{{ db_name }}"
    state: absent
    objs: TABLES
    privs: TRUNCATE,TRIGGER
    type: default_privs
    role: "{{ db_user2 }}"
    target_roles: "{{ db_user1 }}"
    login_user: "{{ pg_user }}"
  check_mode: true
  register: result

- assert:
    that: result is not changed

- name: Check repeating selective default privilege revocation
  become_user: "{{ pg_user }}"
  become: true
  postgresql_privs:
    login_db: "{{ db_name }}"
    state: absent
    objs: TABLES
    privs: TRUNCATE,TRIGGER
    type: default_privs
    role: "{{ db_user2 }}"
    target_roles: "{{ db_user1 }}"
    login_user: "{{ pg_user }}"
  register: result

- assert:
    that: result is not changed

- name: Test default privileges on schemas (PostgreSQL 15+)
  block:
    - name: Grant default schema privileges using uppercase object name
      become_user: "{{ pg_user }}"
      become: true
      postgresql_privs:
        login_db: "{{ db_name }}"
        state: present
        objs: SCHEMAS
        privs: USAGE
        type: default_privs
        role: "{{ db_user2 }}"
        target_roles: "{{ db_user1 }}"
        login_user: "{{ pg_user }}"
      register: result

    - assert:
        that: result is changed

    - name: Revoke default schema privileges using uppercase object name
      become_user: "{{ pg_user }}"
      become: true
      postgresql_privs:
        login_db: "{{ db_name }}"
        state: absent
        objs: SCHEMAS
        privs: USAGE
        type: default_privs
        role: "{{ db_user2 }}"
        target_roles: "{{ db_user1 }}"
        login_user: "{{ pg_user }}"
      register: result

    - assert:
        that: result is changed
  when: postgres_version_resp.stdout is version('15.0', '>=')

# Cleanup
- name: Revoke remaining default table privileges for cleanup
  become_user: "{{ pg_user }}"
  become: true
  postgresql_privs:
    login_db: "{{ db_name }}"
    state: absent
    objs: TABLES
    privs: SELECT
    type: default_privs
    role: "{{ db_user2 }}"
    target_roles: "{{ db_user1 }}"
    login_user: "{{ pg_user }}"

- name: Revoke remaining default sequence privileges for cleanup
  become_user: "{{ pg_user }}"
  become: true
  postgresql_privs:
    login_db: "{{ db_name }}"
    state: absent
    objs: SEQUENCES
    privs: USAGE
    type: default_privs
    role: "{{ db_user2 }}"
    target_roles: "{{ db_user1 }}"
    login_user: "{{ pg_user }}"

- name: Remove user given permissions
  become_user: "{{ pg_user }}"
  become: true
  postgresql_user:
    name: "{{ db_user2 }}"
    state: absent
    login_db: "{{ db_name }}"
    login_user: "{{ pg_user }}"

- name: Remove user owner of objects
  become_user: "{{ pg_user }}"
  become: true
  postgresql_user:
    name: "{{ db_user3 }}"
    state: absent
    login_db: "{{ db_name }}"
    login_user: "{{ pg_user }}"

- name: Destroy DBs
  become_user: "{{ pg_user }}"
  become: true
  postgresql_db:
    state: absent
    name: "{{ item }}"
    login_user: "{{ pg_user }}"
  loop:
    - "{{ db_name }}"
    - "{{ db_session_role1 }}"

- name: Remove test users
  become_user: "{{ pg_user }}"
  become: true
  postgresql_user:
    name: "{{ item }}"
    state: absent
    login_db: postgres
    login_user: "{{ pg_user }}"
  loop:
    - "{{ db_user1 }}"
    - "{{ db_session_role1 }}"
    - "{{ db_session_role2 }}"
