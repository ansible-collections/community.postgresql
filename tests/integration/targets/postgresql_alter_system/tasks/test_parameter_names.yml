####################################################################
# WARNING: These are designed specifically for Ansible tests       #
# and should not be used as examples of how to write Ansible roles #
####################################################################

# pg_stat_statements is available in the normal test environment. It exercises
# a real dotted GUC; the reserved suffix online_analyze.verbose is unit-tested
# because online_analyze is not installed in the stock PostgreSQL containers.
- name: Test quoting a dotted configuration parameter name
  become: true
  become_user: '{{ pg_user }}'
  vars:
    guc_name: pg_stat_statements.track
    desired_value: "{{ 'all' if initial_setting.query_result[0].setting == 'top' else 'top' }}"
    unknown_names:
    - work mem
    - work%mem
    - custom..option
    # Multiple dots are valid syntax, but this parameter is not registered.
    - custom.subsystem.option
    - '"pg_stat_statements.track'
    - '"pg_stat_statements"."track"'
  module_defaults:
    community.postgresql.postgresql_alter_system:
      login_user: '{{ pg_user }}'
      login_db: postgres
      param: '{{ guc_input }}'
      trust_input: false
    community.postgresql.postgresql_query:
      login_user: '{{ pg_user }}'
      login_db: postgres
      query: SELECT setting FROM pg_catalog.pg_settings WHERE name = %(name)s
      named_args:
        name: '{{ guc_name }}'
  block:
  - name: Read the original setting using the logical name
    community.postgresql.postgresql_query: {}
    register: initial_setting

  - name: Ensure the configuration parameter is registered
    ansible.builtin.assert:
      that:
      - initial_setting.query_result | length == 1

  - name: Set the parameter in check mode
    community.postgresql.postgresql_alter_system:
      value: '{{ desired_value }}'
    check_mode: true
    register: result

  - name: Check the reported SQL and unchanged setting
    ansible.builtin.assert:
      that:
      - result is changed
      - result.executed_queries == ['ALTER SYSTEM SET "pg_stat_statements"."track" = ' ~ "'" ~ desired_value ~ "'", 'SELECT pg_reload_conf()']
      - result.diff.before == result.diff.after

  - name: Read the setting after check mode
    community.postgresql.postgresql_query: {}
    register: result

  - name: Ensure check mode did not change the database
    ansible.builtin.assert:
      that:
      - result.query_result == initial_setting.query_result

  - name: Set the parameter
    community.postgresql.postgresql_alter_system:
      value: '{{ desired_value }}'
    register: result

  - name: Check the SET result
    ansible.builtin.assert:
      that:
      - result is changed
      - result.executed_queries == ['ALTER SYSTEM SET "pg_stat_statements"."track" = ' ~ "'" ~ desired_value ~ "'", 'SELECT pg_reload_conf()']

  - name: Read the changed setting
    community.postgresql.postgresql_query: {}
    register: result

  - name: Verify the new value in PostgreSQL
    ansible.builtin.assert:
      that:
      - result.query_result[0].setting == desired_value

  - name: Set the same value again
    community.postgresql.postgresql_alter_system:
      value: '{{ desired_value }}'
    register: result

  - name: Check idempotence
    ansible.builtin.assert:
      that:
      - result is not changed
      - result.executed_queries == []

  - name: Read the configuration before testing unknown names
    community.postgresql.postgresql_query:
      query: SELECT pg_read_file('postgresql.auto.conf') AS content
      named_args: {}
    register: original_config

  - name: Reject unknown names in SET and RESET in actual and check mode
    community.postgresql.postgresql_alter_system:
      param: '{{ item[0] }}'
      value: '{{ item[1] }}'
    check_mode: '{{ item[2] }}'
    loop: '{{ unknown_names | product(["on", "_RESET"], [false, true]) | list }}'
    ignore_errors: true
    register: rejected_names

  - name: Check that metadata lookup rejected each unknown name
    ansible.builtin.assert:
      that:
      - item is failed
      - item is not changed
      - item.msg == 'Parameter ' ~ item.item[0] ~ ' does not exist'
    loop: '{{ rejected_names.results }}'

  - name: Read the configuration after testing unknown names
    community.postgresql.postgresql_query:
      query: SELECT pg_read_file('postgresql.auto.conf') AS content
      named_args: {}
    register: result

  - name: Ensure rejected names did not change the configuration
    ansible.builtin.assert:
      that:
      - result.query_result == original_config.query_result

  always:
  - name: Reset the parameter
    community.postgresql.postgresql_alter_system:
      value: _RESET
    register: result

  - name: Check the RESET result
    ansible.builtin.assert:
      that:
      - result is changed
      - result.executed_queries == ['ALTER SYSTEM RESET "pg_stat_statements"."track"', 'SELECT pg_reload_conf()']

  - name: Read the setting after RESET
    community.postgresql.postgresql_query: {}
    register: result

  - name: Verify RESET restored the original setting
    ansible.builtin.assert:
      that:
      - result.query_result == initial_setting.query_result
