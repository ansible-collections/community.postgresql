####################################################################
# WARNING: These are designed specifically for Ansible tests       #
# and should not be used as examples of how to write Ansible roles #
####################################################################

- vars:
    task_parameters: &task_parameters
      become_user: '{{ pg_user }}'
      become: true
      register: result
    pg_parameters: &pg_parameters
      login_user: '{{ pg_user }}'
      login_db: postgres

  block:
  - name: Set value of type real in check_mode
    <<: *task_parameters
    check_mode: true
    postgresql_alter_system:
      <<: *pg_parameters
      param: autovacuum_analyze_scale_factor
      value: 1

  - name: Check the result
    assert:
      that:
      - result is changed
      - result.restart_required == False
      - result.executed_queries == ["ALTER SYSTEM SET autovacuum_analyze_scale_factor = '1'", "SELECT pg_reload_conf()"]
      - result["attrs"]["boot_val"] == 0.1
      - result["attrs"]["context"] == "sighup"
      - result["attrs"]["enumvals"] == None
      - result["attrs"]["unit"] == None
      - result["attrs"]["vartype"] == "real"
      - result["attrs"]["min_val"] == 0
      - result["attrs"]["max_val"] == 100
      - result["diff"]["before"]["pending_restart"] == False
      - result["diff"]["before"]["setting"] == 0.1
      - result["diff"]["after"]["pending_restart"] == False
      - result["diff"]["after"]["setting"] == 0.1

  - name: Check nothing has changed
    <<: *task_parameters
    postgresql_query:
      <<: *pg_parameters
      query: "SELECT setting FROM pg_catalog.pg_settings WHERE name = 'autovacuum_analyze_scale_factor'"

  - name: Check the output
    assert:
      that:
      - result.query_result[0]["setting"] == "0.1"

  - name: Set value of type real
    <<: *task_parameters
    postgresql_alter_system:
      <<: *pg_parameters
      param: autovacuum_analyze_scale_factor
      value: 1

  - name: Check the result
    assert:
      that:
      - result is changed
      - result.executed_queries == ["ALTER SYSTEM SET autovacuum_analyze_scale_factor = '1'", "SELECT pg_reload_conf()"]
      - result["attrs"]["boot_val"] == 0.1
      - result["attrs"]["context"] == "sighup"
      - result["attrs"]["enumvals"] == None
      - result["attrs"]["unit"] == None
      - result["attrs"]["vartype"] == "real"
      - result["attrs"]["min_val"] == 0
      - result["attrs"]["max_val"] == 100
      - result["diff"]["before"]["pending_restart"] == False
      - result["diff"]["before"]["setting"] == 0.1
      - result["diff"]["after"]["pending_restart"] == False
      - result["diff"]["after"]["setting"] == 1

  - name: Check it has changed
    <<: *task_parameters
    postgresql_query:
      <<: *pg_parameters
      query: "SELECT setting FROM pg_catalog.pg_settings WHERE name = 'autovacuum_analyze_scale_factor'"

  - name: Check the output
    assert:
      that:
      - result.query_result[0]["setting"] == "1"

  - name: Set value of type real again
    <<: *task_parameters
    postgresql_alter_system:
      <<: *pg_parameters
      param: autovacuum_analyze_scale_factor
      value: 1

  - name: Check the result
    assert:
      that:
      - result is not changed
      - result.executed_queries == []
      - result["attrs"]["boot_val"] == 0.1
      - result["attrs"]["context"] == "sighup"
      - result["attrs"]["enumvals"] == None
      - result["attrs"]["unit"] == None
      - result["attrs"]["vartype"] == "real"
      - result["attrs"]["min_val"] == 0
      - result["attrs"]["max_val"] == 100
      - result["diff"]["before"]["pending_restart"] == False
      - result["diff"]["before"]["setting"] == 1
      - result["diff"]["after"]["pending_restart"] == False
      - result["diff"]["after"]["setting"] == 1

  # http://github.com/ansible-collections/community.postgresql/issues/853
  # it should just pass w/o any error
  - name: Set value of type real with a max val in scientific notation
    <<: *task_parameters
    postgresql_alter_system:
      <<: *pg_parameters
      param: random_page_cost
      value: 4

  - name: Check max_val
    assert:
      that:
      - result["attrs"]["max_val"] == "1.79769e+308"

  # pg_settings shows real values with 6 significant digits
  # and small ones in scientific notation, e.g. 1e-05
  - name: Test real values with decimals and in scientific notation
    block:
    - name: Set a real value written with a decimal part
      <<: *task_parameters
      postgresql_alter_system:
        <<: *pg_parameters
        param: autovacuum_vacuum_scale_factor
        value: '0.50'

    - name: Check the result
      assert:
        that:
        - result is changed
        - result["diff"]["after"]["setting"] == 0.5

    - name: Set the same value written as an integer with a decimal part
      <<: *task_parameters
      postgresql_alter_system:
        <<: *pg_parameters
        param: seq_page_cost
        value: '1.0'

    - name: Check the result
      assert:
        that:
        - result is not changed
        - result.executed_queries == []

    - name: Set a small real value in check mode
      <<: *task_parameters
      check_mode: true
      postgresql_alter_system:
        <<: *pg_parameters
        param: autovacuum_vacuum_scale_factor
        value: '0.00001'

    - name: Check the result
      assert:
        that:
        - result is changed
        - result.executed_queries == ["ALTER SYSTEM SET autovacuum_vacuum_scale_factor = '0.00001'", "SELECT pg_reload_conf()"]

    - name: Check nothing has changed
      <<: *task_parameters
      postgresql_query:
        <<: *pg_parameters
        query: "SELECT setting FROM pg_catalog.pg_settings WHERE name = 'autovacuum_vacuum_scale_factor'"

    - name: Check the output
      assert:
        that:
        - result.query_result[0]["setting"] == "0.5"

    - name: Set a small real value
      <<: *task_parameters
      postgresql_alter_system:
        <<: *pg_parameters
        param: autovacuum_vacuum_scale_factor
        value: '0.00001'

    - name: Check the result
      assert:
        that:
        - result is changed
        - result["diff"]["after"]["setting"] | float == 0.00001

    - name: Check the setting is shown in scientific notation
      <<: *task_parameters
      postgresql_query:
        <<: *pg_parameters
        query: "SELECT setting FROM pg_catalog.pg_settings WHERE name = 'autovacuum_vacuum_scale_factor'"

    - name: Check the output
      assert:
        that:
        - result.query_result[0]["setting"] == "1e-05"

    - name: Set the same value again in both notations
      <<: *task_parameters
      postgresql_alter_system:
        <<: *pg_parameters
        param: autovacuum_vacuum_scale_factor
        value: '{{ item }}'
      loop:
      - '0.00001'
      - '1e-05'

    - name: Check idempotence
      assert:
        that:
        - item is not changed
        - item.executed_queries == []
      loop: '{{ result.results }}'

    - name: Set a value with more than 6 significant digits
      <<: *task_parameters
      postgresql_alter_system:
        <<: *pg_parameters
        param: autovacuum_vacuum_scale_factor
        value: '0.123456789'

    - name: Set it again
      <<: *task_parameters
      postgresql_alter_system:
        <<: *pg_parameters
        param: autovacuum_vacuum_scale_factor
        value: '0.123456789'

    - name: Check idempotence
      assert:
        that:
        - result is not changed
        - result.executed_queries == []

    # vacuum_cost_delay is of type real with unit ms
    - name: Set a real param with a time unit to a fractional value in check mode
      <<: *task_parameters
      check_mode: true
      postgresql_alter_system:
        <<: *pg_parameters
        param: vacuum_cost_delay
        value: '0.5'

    - name: Check the result
      assert:
        that:
        - result is changed
        - result.executed_queries == ["ALTER SYSTEM SET vacuum_cost_delay = '0.5'", "SELECT pg_reload_conf()"]

    - name: Check nothing has changed
      <<: *task_parameters
      postgresql_query:
        <<: *pg_parameters
        query: "SELECT setting FROM pg_catalog.pg_settings WHERE name = 'vacuum_cost_delay'"

    - name: Check the output
      assert:
        that:
        - result.query_result[0]["setting"] == "0"

    - name: Set a real param with a time unit to a fractional value
      <<: *task_parameters
      postgresql_alter_system:
        <<: *pg_parameters
        param: vacuum_cost_delay
        value: '0.5'

    - name: Check the result
      assert:
        that:
        - result is changed

    - name: Check the setting
      <<: *task_parameters
      postgresql_query:
        <<: *pg_parameters
        query: "SELECT setting FROM pg_catalog.pg_settings WHERE name = 'vacuum_cost_delay'"

    - name: Check the output
      assert:
        that:
        - result.query_result[0]["setting"] == "0.5"

    - name: Set the same value again, also with another unit
      <<: *task_parameters
      postgresql_alter_system:
        <<: *pg_parameters
        param: vacuum_cost_delay
        value: '{{ item }}'
      loop:
      - '0.5'
      - '0.5ms'
      - '500us'

    - name: Check idempotence
      assert:
        that:
        - item is not changed
        - item.executed_queries == []
      loop: '{{ result.results }}'

    always:
    - name: Reset the params
      <<: *task_parameters
      postgresql_alter_system:
        <<: *pg_parameters
        param: '{{ item }}'
        value: _RESET
      loop:
      - autovacuum_vacuum_scale_factor
      - seq_page_cost
      - vacuum_cost_delay
